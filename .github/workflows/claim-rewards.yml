name: Hive Reward Claimer

on:
  schedule:
    - cron: '8 * * * *' # Runs daily at 8 mins past the hour
  workflow_dispatch:      # Manual trigger button in GitHub UI

jobs:
  claim:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run reward claim script
        env:
          AAFENG_HIVE_POSTING_KEY: ${{ secrets.AAFENG_HIVE_POSTING_KEY }}
        run: node index.js
        
